name: Prepare complete localized release
on:
  push:
    branches: [portfolio-multilingual]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate source and generate complete site
        run: |
          python3 security/release_check.py
          python3 tools/localize.py --require-complete --output "$RUNNER_TEMP/bixcore-release"
          test "$(find "$RUNNER_TEMP/bixcore-release" -name '*.html' | wc -l)" -eq 117
      - name: Commit generated site to staging only
        run: |
          test "$GITHUB_REF" = refs/heads/portfolio-multilingual
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/bixcore-release/CNAME")" = lab.bixcore.de
          git rm -r docs
          cp -a "$RUNNER_TEMP/bixcore-release" docs
          git add docs
          git config user.name bixstriker
          git config user.email 212264745+bixstriker@users.noreply.github.com
          git commit -m "Generate complete 117-page static multilingual release"
          python3 security/release_check.py
          git push origin HEAD:refs/heads/portfolio-multilingual
